<!-- wp:html -->
<style id="cfm-sticky-css">
.cfm-sticky-footer{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#0c1f35;color:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.18);transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);will-change:transform;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.cfm-sticky-footer.cfm-visible{transform:translateY(0)}
.cfm-sticky-footer.cfm-dismissed{display:none}
.cfm-sticky-inner{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.cfm-sticky-text{display:flex;flex-direction:column;gap:2px}
.cfm-sticky-headline{font-size:.95rem;font-weight:700;color:#fff;line-height:1.3}
.cfm-sticky-sub{font-size:.78rem;color:#7cbfe8;line-height:1.3}
.cfm-sticky-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cfm-sticky-call{display:flex;align-items:center;gap:8px;background:#1a7a4a;color:#fff;text-decoration:none;font-size:1rem;font-weight:700;padding:9px 20px;border-radius:8px;transition:background .18s,transform .15s;white-space:nowrap;animation:cfmPulse 2.5s ease-in-out infinite}
.cfm-sticky-call:hover{background:#15693e;transform:scale(1.02)}
.cfm-sticky-call svg{flex-shrink:0}
.cfm-sticky-book{display:flex;align-items:center;background:#fff;color:#0c1f35;text-decoration:none;font-size:.95rem;font-weight:700;padding:9px 18px;border-radius:8px;transition:background .18s;white-space:nowrap}
.cfm-sticky-book:hover{background:#e8ecf0}
.cfm-sticky-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:1.4rem;cursor:pointer;padding:4px 6px;line-height:1;transition:color .2s}
.cfm-sticky-close:hover{color:#fff}
@keyframes cfmPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}}
@media(max-width:680px){.cfm-sticky-text{display:none}.cfm-sticky-book{display:none}.cfm-sticky-inner{justify-content:center}.cfm-sticky-call{font-size:1.05rem;padding:11px 24px}}
@media(prefers-reduced-motion:reduce){.cfm-sticky-call{animation:none}.cfm-sticky-footer{transition:none}}
</style>

<div class="cfm-sticky-footer" id="cfmStickyFooter" role="complementary" aria-label="Quick contact">
  <div class="cfm-sticky-inner">
    <div class="cfm-sticky-text">
      <span class="cfm-sticky-headline">Carpet Cleaning in Medford, Oregon</span>
      <span class="cfm-sticky-sub">IICRC Certified · Upfront Pricing · Jackson County Local</span>
    </div>
    <div class="cfm-sticky-actions">
      <a href="https://carpetcleaningmedfordoregon.com/#book" class="cfm-sticky-book">Book Now</a>
      <a href="tel:+14583020101" class="cfm-sticky-call" aria-label="Call Carpet Friend Medford at (458) 302-0101">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .84h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
        </svg>
        <span>(458) 302-0101</span>
      </a>
      <button class="cfm-sticky-close" id="cfmStickyClose" aria-label="Close this bar">&times;</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  var bar = document.getElementById('cfmStickyFooter');
  var closeBtn = document.getElementById('cfmStickyClose');
  if (!bar) return;

  function storageGet(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, val) {
    try { sessionStorage.setItem(key, val); } catch (e) {}
  }

  var shown = false;
  if (storageGet('cfmStickyDismissed')) { bar.classList.add('cfm-dismissed'); return; }

  function show() {
    if (shown) return;
    shown = true;
    bar.classList.add('cfm-visible');
  }

  setTimeout(show, 4000);

  window.addEventListener('scroll', function() {
    if (window.scrollY > 400) show();
  }, { passive: true });

  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      bar.classList.remove('cfm-visible');
      bar.classList.add('cfm-dismissed');
      storageSet('cfmStickyDismissed', '1');
    });
  }
})();
</script>
